[package]
name = "divoom-ditoo-pro-controller"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
env_logger = "0.11.6"
log = "0.4.26"
time = "0.3.37"
futures = "0.3.31"
hex = "0.4.3"
image = "0.25.5"
byteorder = "1.5.0"
bitstream-io = "2.6.0"
chrono = "0.4.40"
indexmap = "2.7.1"

[target.'cfg(target_os = "linux")'.dependencies]
bluetooth-serial-port = "0.6.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
spectral = "0.6.0"

[lints.clippy]
panic = "warn"
expect_used = "warn"
unwrap_used = "warn"
